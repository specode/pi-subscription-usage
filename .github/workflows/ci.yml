# Runs the test suite on every branch push and pull request. Publishing keeps
# its own release-triggered workflow in npm-publish.yml.
name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The tests stub the Pi SDK, so no dependencies are installed.
      - run: npm test
